name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: run the suite
        env:
          MEM_ROOT: ${{ runner.temp }}/mem-test
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: build the wheel and the sdist
        run: uv build
      - name: install each artifact into a clean environment and run it
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            target="/tmp/check-$(basename "$artifact")"
            uv venv "$target"
            uv pip install --python "$target/bin/python" "$artifact"
            "$target/bin/mem" --version
            "$target/bin/mem" protocol > "$target/PROTOCOL.md"
            cmp "$target/PROTOCOL.md" memlib/PROTOCOL.md
          done

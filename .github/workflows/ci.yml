name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: run the suite
        shell: bash
        env:
          MEMGROVE_ROOT: ${{ runner.temp }}/memgrove-test
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/unit.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            # Annotations on a public repository are readable without signing
            # in, so a failing window or Windows job stays diagnosable from
            # outside the browser. Percent is the workflow-command escape.
            grep -E '^(FAIL|ERROR):|Error:|AssertionError' "$RUNNER_TEMP/unit.log" \
              | head -25 \
              | sed 's/%/%25/g; s/\r//g' \
              | while IFS= read -r line; do echo "::error::$line"; done
            tail -60 "$RUNNER_TEMP/unit.log"
          fi
          exit "$status"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: build the wheel and the sdist
        run: uv build
      - name: install each artifact into a clean environment and run it
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            target="/tmp/check-$(basename "$artifact")"
            uv venv "$target"
            uv pip install --python "$target/bin/python" "$artifact"
            "$target/bin/memgrove" --version
            "$target/bin/memgrove" protocol > "$target/PROTOCOL.md"
            cmp "$target/PROTOCOL.md" memgrove/PROTOCOL.md
          done

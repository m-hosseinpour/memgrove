[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memgrove"
dynamic = ["version"]
description = "Local-first persistent Markdown memory for AI coding agents, shared across MCP-compatible clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahdi Hosseinpour" }]
keywords = [
  "ai-agents",
  "claude-code",
  "coding-agents",
  "deepseek",
  "deepseek-harness",
  "dsh",
  "local-first",
  "markdown",
  "mcp",
  "model-context-protocol",
  "opencode",
  "persistent-memory",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Documentation",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/m-hosseinpour/memgrove"
Issues = "https://github.com/m-hosseinpour/memgrove/issues"

[project.scripts]
memgrove = "memgrove.cli:main"

[tool.hatch.version]
path = "memgrove/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["memgrove"]
